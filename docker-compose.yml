services:
  # 1. Database Service
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  # 2. Python FastAPI ML Service
  ml-color-service:
    build:
      context: ./ml-color-service
      dockerfile: Dockerfile
    container_name: fast-api-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PYTHONUNBUFFERED=1
    networks:
      - app-network

  # 3. .NET Backend
  backend:
    build:
      context: ./Backend
      dockerfile: LandingPageSystem.WebApi/Dockerfile
    container_name: dotnet-api
    restart: unless-stopped
    ports:
      - "5101:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=${MYSQL_DATABASE};Uid=root;Pwd=${MYSQL_ROOT_PASSWORD};
      - MLServiceUrl=http://ml-color-service:8000/
      - MLService__BaseUrl=http://ml-color-service:8000/
      - PythonService__BaseUrl=http://ml-color-service:8000/
    depends_on:
      - db
      - ml-color-service
    networks:
      - app-network

  # 4. Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextjs-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # SSR internal network communication (Node container -> Backend container on 8080)
      - API_BASE_URL=http://backend:8080
      # Client-side browser communication (Browser -> Host port 5101)
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:5101
      - NEXT_PUBLIC_API_URL=http://localhost:5101
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge