name: Deploy Frontend to ECS

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: landing-page-frontend
        IMAGE_TAG: ${{ github.sha }}
        # Empty = relative /api/* on the same origin. Requires ALB listener rules
        # that forward /api/* to the backend target group (see frontend/Dockerfile).
        NEXT_PUBLIC_API_BASE_URL: ""
      run: |
        cd frontend
        docker build \
          --no-cache \
          --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Register a task definition revision with the new image
      id: task-definition
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: landing-page-frontend
        IMAGE_TAG: ${{ github.sha }}
        ECS_CLUSTER: landing-page-cluster
        ECS_SERVICE: landing-page-frontend-task-service
        CONTAINER_NAME: landing-page-frontend-container
      run: |
        CURRENT_TASK_DEFINITION=$(aws ecs describe-services \
          --cluster "$ECS_CLUSTER" \
          --services "$ECS_SERVICE" \
          --query 'services[0].taskDefinition' \
          --output text)

        aws ecs describe-task-definition \
          --task-definition "$CURRENT_TASK_DEFINITION" \
          --query taskDefinition \
          --output json > task-definition.json

        NEW_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        jq --arg container "$CONTAINER_NAME" --arg image "$NEW_IMAGE" '
          .containerDefinitions |= map(
            if .name == $container then .image = $image else . end
          ) |
          del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )
        ' task-definition.json > new-task-definition.json

        NEW_TASK_DEFINITION=$(aws ecs register-task-definition \
          --cli-input-json file://new-task-definition.json \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)

        echo "arn=$NEW_TASK_DEFINITION" >> "$GITHUB_OUTPUT"

    - name: Deploy the new task definition and wait for it to become healthy
      run: |
        aws ecs update-service \
          --cluster landing-page-cluster \
          --service landing-page-frontend-task-service \
          --task-definition "${{ steps.task-definition.outputs.arn }}" \
          --force-new-deployment \
          --region ${{ secrets.AWS_REGION }}

        aws ecs wait services-stable \
          --cluster landing-page-cluster \
          --services landing-page-frontend-task-service \
          --region ${{ secrets.AWS_REGION }}
